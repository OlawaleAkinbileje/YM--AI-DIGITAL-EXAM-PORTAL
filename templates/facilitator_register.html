<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Facilitator Account | YMO Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 36px 32px;
      border-radius: 12px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .hub-tag {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #2563eb;
      margin-bottom: 6px;
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
      color: #0f172a;
    }
    p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .alert-error {
      background: #fef2f2;
      border-left: 4px solid #ef4444;
      color: #991b1b;
      padding: 10px 14px;
      font-size: 13.5px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 18px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14.5px;
      outline: none;
    }
    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .btn-register {
      width: 100%;
      background: var(--ymo-green);
      color: #ffffff;
      padding: 13px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-register:hover {
      background: #1d4ed8;
    }
    .footer-links {
      text-align: center;
      margin-top: 20px;
      font-size: 13.5px;
      color: #64748b;
    }
    .footer-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="card">
  <img src="/static/img/ymo_logo.jpg" alt="YMO Logo" style="width: 60px; height: 60px; border-radius: 12px; object-fit: cover; border: 2px solid #d97706; margin: 0 auto 12px auto; display: block; box-shadow: 0 4px 10px rgba(217, 119, 6, 0.2);">
  <div class="hub-tag" style="color: #044e39;">YEYE MOREMI OODUA TRAINING HUB</div>
  <h2>Create Facilitator Account</h2>
  <p>Register as a cohort instructor to create questions, configure exams, and manage grades.</p>

  {% if error %}
    <div class="alert-error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/facilitator/register">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required placeholder="e.g. Adebayo Ogunlesi" autofocus>
    </div>

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required placeholder="e.g. adebayo">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter a password">
      </div>
    </div>

    <div class="form-group">
      <label for="course_code">Assigned Course Track</label>
      <select id="course_code" name="course_code" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14.5px; outline: none; background: #ffffff;">
        <option value="ALL">All Courses (Lead Facilitator / Administrator)</option>
        <option value="AIGA">Artificial Intelligence and Generative AI (AIGA)</option>
        <option value="DL">Digital Literacy (DL)</option>
        <option value="GDCC">Graphic Design and Content Creation (GDCC)</option>
        <option value="CP">Coding and Programming (CP)</option>
        <option value="DM">Digital Marketing and Social Media (DM)</option>
      </select>
    </div>

    <button type="submit" class="btn-register">Create Account</button>
  </form>

  <div class="footer-links">
    Already have an account? <a href="/facilitator/login">Sign In</a><br><br>
    <a href="/" style="color: #64748b; font-weight: normal;">← Return to Candidate Exam Portal</a>
  </div>
</div>

</body>
</html>
